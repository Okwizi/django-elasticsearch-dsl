name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Check lockfile is up to date
        run: uv lock --check

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2", "4.2.8", "5.0", "5.1", "5.1.3", "5.2"]
        es-version: ["9.0.2"]

        exclude:
          - django-version: "4.2"
            python-version: "3.12"
          - django-version: "4.2"
            python-version: "3.13"
          - django-version: "4.2.8"
            python-version: "3.13"
          - django-version: "5.0"
            python-version: "3.9"
          - django-version: "5.1"
            python-version: "3.9"
          - django-version: "5.1.3"
            python-version: "3.9"
          - django-version: "5.2"
            python-version: "3.9"

    steps:
      - name: Install and Run Elasticsearch
        uses: elastic/elastic-github-actions/elasticsearch@master
        with:
          stack-version: ${{ matrix.es-version }}

      - uses: actions/checkout@v7

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install tox-uv
        run: uv pip install --system tox-uv

      - name: Run tests with Python ${{ matrix.python-version }} and Django ${{ matrix.django-version }}
        run: |
          TOX_ENV=$(echo "py${{ matrix.python-version }}-dj${{ matrix.django-version }}" | tr -d .)
          python -m tox -e $TOX_ENV -- --elasticsearch
          python -m tox -e $TOX_ENV -- --elasticsearch --signal-processor celery

      - name: Publish Coverage Report
        uses: codecov/codecov-action@v3
